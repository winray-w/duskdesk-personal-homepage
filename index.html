<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b254b">
  <meta name="description" content="一个暮色像素风的个人主页模板。">
  <title>Your Name — 灵感桌面</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="layout.css">
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="i-star" viewBox="0 0 32 32"><path d="M14 0h4v10h4v4h10v4H22v4h-4v10h-4V22h-4v-4H0v-4h10v-4h4z" fill="currentColor"/></symbol>
      <symbol id="i-home" viewBox="0 0 48 48"><path d="M8 20h8v-8h8V4h8v8h8v8h4v24H8z" fill="#e4a8b8"/><path d="M4 20h8v-8h8V4h12v8h8v8h8v8h-8v16H8V28H0v-8zm12 8v16h12V28z" fill="#fce9c9"/><path d="M20 32h8v12h-8z" fill="#6b4677"/></symbol>
      <symbol id="i-folder" viewBox="0 0 48 48"><path d="M3 10h17l5 6h20v27H3z" fill="#b96658"/><path d="M3 7h17l6 7h19v9H3z" fill="#f5bc71"/><path d="M0 21h48l-4 22H4z" fill="#ffda8d"/><path d="M18 26h-4v4h-4v4h4v4h4v-4h-4v-4h4zm12 0h4v4h4v4h-4v4h-4v-4h4v-4h-4z" fill="#a05b63"/></symbol>
      <symbol id="i-mail" viewBox="0 0 48 48"><path d="M2 12h44v30H2z" fill="#b96c8c"/><path d="M2 8h44v29H2z" fill="#f8d0cf"/><path d="M2 8h44v5h-6v5h-7v5h-6v5h-6v-5h-6v-5H8v-5H2z" fill="#fff0d6"/><path d="M5 34h9v-5h5v-5h-5v5H9zm38 0h-9v-5h-5v-5h5v5h5z" fill="#d894aa"/></symbol>
      <symbol id="i-github" viewBox="0 0 24 24"><path d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.77-.24.77-.54v-2.1c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.64-1.25-1.64-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.71 2.62 1.22 3.26.94.1-.73.39-1.22.71-1.5-2.5-.28-5.13-1.25-5.13-5.57 0-1.23.44-2.23 1.16-3.02-.12-.29-.5-1.43.11-2.98 0 0 .95-.3 3.08 1.15a10.7 10.7 0 0 1 5.6 0c2.14-1.45 3.08-1.15 3.08-1.15.61 1.55.23 2.69.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.33-2.63 5.29-5.14 5.57.4.35.76 1.03.76 2.08v3.08c0 .3.2.65.77.54A11.2 11.2 0 0 0 12 .8" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <div class="wallpaper" aria-hidden="true">
    <div class="sun"></div>
    <svg class="landscape" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="water" x2="0" y2="1"><stop stop-color="#b16e9c"/><stop offset="1" stop-color="#454065"/></linearGradient><linearGradient id="glow" x2="0" y2="1"><stop stop-color="#ffc89a" stop-opacity=".8"/><stop offset="1" stop-color="#ffc89a" stop-opacity="0"/></linearGradient></defs>
      <g fill="#fbd6ab" opacity=".55"><path d="M118 126h5v5h-5zm182-42h4v4h-4zm465 62h4v4h-4zm310-84h4v4h-4zm351 64h5v5h-5zm100 121h4v4h-4zm-914-77h3v3h-3z"/><path d="M1250 104h3v-7h3v7h7v3h-7v7h-3v-7h-7v-3zm-848 61h3v-6h3v6h6v3h-6v6h-3v-6h-6v-3z"/></g>
      <g fill="#e7abc3" opacity=".24"><path d="M790 180h110v-9h55v9h50v10h-215zm431 88h100v-10h75v10h60v10h-235zM185 289h76v-9h70v9h42v9H185z"/></g>
      <path d="M0 538h38v-30h42v-22h37v22h29v-61h35v-18h30v79h28v-47h39v-17h26v64h31v-82h17v-32h8v-20h7v20h9v32h17v76h38v-38h49v14h21v38h32v-16h31v-33h25v-15h16v48h21v-70h42v-24h17v-17h6v17h18v24h19v70h29v-30h38v-30h27v60h24v-20h30v34h42v-39h24v-57h7v-37h7v-24h5v24h7v37h7v57h23v39h41v-57h48v-15h19v72h35v-21h28v-36h38v57h30v-17h29v-47h14v-15h6v15h14v47h46v-41h30v-21h24v62h29v-20h39v-49h12v-22h7v22h12v49h40v-27h21v27h62v36h40v-77h55v77h47v-27h52v27h46v-23h45v90H0z" fill="#9d648c"/>
      <path d="M0 547h61v-18h52v18h28v-41h35v-13h14v54h52v-17h41v17h25v-70h28v-16h18v86h46v-29h35v-42h23v71h49v-19h39v19h31v-50h35v-17h21v67h44v-15h48v15h29v-39h31v-28h29v67h50v-19h37v19h34v-50h14v-17h8v17h20v50h44v-33h25v-21h20v54h48v-16h32v16h47v-49h40v49h27v-29h35v29h43v-64h31v-13h16v77h46v-19h31v19h30v-44h30v44h26v-27h29v27h47v-14h34v14h76v-32h51v32h55v32H0z" fill="#694b75"/>
      <!-- The cat and its landing spots share the skyline's SVG coordinates. -->
      <path d="M677 532h48m60-52h29m50 48h37m56-31h20" stroke="#e9b7bc" stroke-width="2" opacity=".45"/>
      <g class="rooftop-cat" transform="translate(700 532)">
        <g class="cat-facing">
          <g class="cat-body" shape-rendering="crispEdges">
            <path class="cat-tail" d="M-15-8h-9v-5h-5v-10h5v6h5v5h4z" fill="#e6a3b1"/>
            <path d="M-17-34h8v8H7v-8h8v12h4v16h-4v3h-3v3H4v-4H-5v4h-8v-3h-4v-5h-4v-14h4z" fill="#51374f"/>
            <path d="M-14-30h4v8H9v-8h3v11h4v12h-6v3H-9v-3h-9v-12h4z" fill="#f4bcc8"/>
            <path d="M-13-14h23v7H-13z" fill="#ffe6d0"/>
            <path d="M-16-21h12v7h-9v-2h-3zm15 0h13v5H9v2H-1zm-4 1h5v2h-5z" fill="#382b45"/>
            <path d="M6-21h2v2h2v2H8v2H6v-2H4v-2h2z" fill="#fff2db"/>
            <path d="M-3-9h3v2h-3z" fill="#a25d7d"/>
            <path d="M-12-4h7v4h-7zm16 0h7v4H4z" fill="#f4bcc8"/>
            <path d="M-10-29h2v5h-2zm19 0h2v5H9z" fill="#d482a1"/>
          </g>
        </g>
        <path class="cat-spark" d="M-30-40h3v-4h3v4h4v3h-4v4h-3v-4h-3z" fill="#ffe1a4"/>
      </g>
      <path d="M0 571h1600v329H0z" fill="url(#water)"/><path d="M918 572h182v10h-15v10h39v8H904v-8h31v-10h-17zm-50 41h284v8H868zm33 21h231v8H901zm-65 22h342v8H836zm40 24h263v8H876zm-79 26h409v8H797zm29 32h348v8H826zm-84 35h499v8H742zm36 37h432v8H778z" fill="url(#glow)"/>
      <g fill="#e2a6b7" opacity=".38"><path d="M109 612h156v4H109zm217 40h180v4H326zm-273 52h187v4H53zm1201-69h193v4h-193zm-14 85h229v4h-229zm-816 72h176v4H424zm-136-39h97v4h-97z"/></g>
      <path d="M0 709h56v18h67v14h73v27h54v28h76v16h71v28h69v60H0zm1600-66h-45v25h-62v19h-55v34h-63v33h-51v33h-60v32h-79v32h-55v49h530z" fill="#37334f"/>
      <path d="M0 818h83v-15h35v20h58v18h61v25h97v34H0zm1600-65h-57v30h-50v23h-60v32h-62v31h-83v31h312z" fill="#28283f"/>
      <g stroke="#26283d" stroke-width="6" fill="none"><path d="M0 743h233v44h138v91M0 768h233m-183-25v108m62-108v119m64-119v126m57-84v92m69-50v76m-69-72h138"/></g>
      <g fill="#f6cba5"><path d="M1398 764h8v-8h8v8h8v8h-8v8h-8v-8h-8zM1461 735h7v-7h7v7h7v7h-7v7h-7v-7h-7z"/></g><path d="M1410 779v55m62-86v38" stroke="#7c8b79" stroke-width="5"/>
    </svg>
    <div class="sky-motion"><span class="meteor"></span><span class="meteor meteor-second"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span></div>
    <div class="grain"></div>
  </div>

  <header class="menu-bar">
    <a class="brand" href="./" aria-label="Your Name 主页"><svg><use href="#i-star"/></svg><strong data-bind="name">Your Name</strong><span class="brand-note" data-bind="desktopLabel">的灵感桌面</span></a>
    <div class="menu-right"><span class="weather"><span aria-hidden="true">☀</span> 落日放映中</span><time id="clock">--:--</time></div>
  </header>

  <main class="desktop">
    <div class="scene">
    <nav class="desktop-shortcuts" aria-label="桌面栏目">
      <button class="shortcut" data-open="about"><svg><use href="#i-home"/></svg><span>关于我</span></button>
      <button class="shortcut" data-open="projects"><svg><use href="#i-folder"/></svg><span>造物匣</span></button>
      <button class="shortcut" data-open="contact"><svg><use href="#i-mail"/></svg><span>联系我</span></button>
    </nav>

    <section class="intro" aria-label="Bring ideas to life">
      <div class="intro-note"><span class="tiny-star">✦</span> <span data-bind="introNote">把脑海里的小小火花，变成眼前的作品。</span></div>
      <h1 aria-label="Bring ideas to life"><span class="bring">Bring</span><span class="ideas"><span>i</span><span>d</span><span>e</span><span>a</span><span>s</span></span><span class="life">to life<span class="period">.</span><svg class="title-star" aria-hidden="true"><use href="#i-star"/></svg></span></h1>
      <p class="intro-caption">你好，我是 <strong data-bind="name">Your Name</strong>。<br><span data-bind="welcome">欢迎随便逛逛，看看我正在折腾什么。</span></p>
      <button class="explore-link" data-open="projects"><span class="pixel-arrow" aria-hidden="true">↗</span> 打开造物匣，看看我的项目</button>
    </section>

    <aside class="profile-card" aria-label="Your Name 的个人名片">
      <div class="window-bar"><span class="window-lights" aria-hidden="true"><i></i><i></i><i></i></span><span>hello, world</span><svg aria-hidden="true"><use href="#i-star"/></svg></div>
      <div class="profile-content"><div class="avatar-frame"><img src="assets/avatar.svg" alt="个人头像" width="144" height="144"><span class="avatar-spark" aria-hidden="true">✧</span></div><h2><span data-bind="name">Your Name</span><span class="name-dot">.</span></h2><p data-bind="tagline">Bring ideas to life</p><button data-open="about" class="profile-button"><svg aria-hidden="true"><use href="#i-star"/></svg>认识一下<span class="profile-link-arrow" aria-hidden="true">↗</span></button></div>
      <div class="profile-footer"><span><i></i> <span data-bind="status">保持好奇</span></span><span data-bind="greeting">很高兴遇见你 :)</span></div>
      <div class="card-tape" aria-hidden="true"></div>
    </aside>

    <div class="sunset-note" aria-hidden="true"><span>时间和我</span><span>都在往前走</span><svg><use href="#i-star"/></svg></div>
    <div class="desktop-caption">Make something you love.</div>
    </div>
  </main>

  <footer class="desktop-footer">
    <span class="footer-note" data-bind="footerNote">慢慢生长中</span>
    <nav class="dock" aria-label="快捷启动栏"><button data-open="about" aria-label="打开关于我"><svg><use href="#i-home"/></svg><span>关于我</span></button><button data-open="projects" aria-label="打开造物匣项目合集"><svg><use href="#i-folder"/></svg><span>造物匣</span></button><button data-open="contact" aria-label="打开联系方式"><svg><use href="#i-mail"/></svg><span>联系我</span></button><span class="dock-divider"></span><button id="pause-motion" class="motion-control" aria-label="暂停动态效果" aria-pressed="false" title="控制楼顶小猫、流星、微光和点击粒子"><svg viewBox="0 0 32 32" aria-hidden="true"><path id="motion-symbol" d="M9 7h5v18H9zm9 0h5v18h-5z" fill="currentColor"/></svg><span class="motion-label">动态已开启</span></button></nav>
    <span class="footer-sign">Made with curiosity <span aria-hidden="true">✦</span></span>
  </footer>

  <dialog id="app-dialog" class="app-window" aria-labelledby="dialog-title">
    <div class="window-bar dialog-bar"><span class="window-lights" aria-hidden="true"><i></i><i></i><i></i></span><span id="dialog-title"></span><button class="close-window" aria-label="关闭窗口"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></div>
    <div id="dialog-content" class="dialog-content"></div>
    <div class="dialog-bottom"><span data-bind="desktopSignature">Your Name 的桌面</span><span>按 Esc 返回桌面</span></div>
  </dialog>

  <!-- 内容由 site.config.js 和 personalize.js 填入；保留这些结构即可。 -->
  <template id="about-template">
    <div class="about-heading"><img src="assets/avatar.svg" alt="个人头像" width="90" height="90"><div><p class="small-note">很高兴认识你</p><h2 data-about-name>你好，我是 Your Name。</h2></div></div>
    <blockquote><span class="about-tagline"></span><span data-about-motto></span></blockquote>
    <p class="body-copy" data-about-bio></p>
    <div class="window-actions"><button class="primary-button" data-open="projects">打开造物匣 <span aria-hidden="true">↗</span></button><button class="secondary-button" data-open="contact">联系我</button></div>
  </template>
  <template id="projects-template">
    <div class="collection-heading"><svg aria-hidden="true"><use href="#i-folder"/></svg><div><p class="small-note">我的项目合集</p><h2>造物匣<span>Ideas, made real.</span></h2></div></div>
    <p class="body-copy" data-projects-intro></p>
    <div class="project-grid"></div>
    <p class="collection-footnote"><span aria-hidden="true">✦</span> 下一份灵感，正在路上。</p>
  </template>
  <template id="project-detail-template">
    <button class="project-back" data-open="projects"><span aria-hidden="true">←</span> 返回造物匣</button>
    <div class="project-preview" aria-label="项目展示卡片"><div class="terminal-title"><span class="terminal-dots">● ● ●</span><span data-project-name></span></div><div class="terminal-body"><p><span class="terminal-prompt" data-project-caption></span></p><p class="terminal-muted" data-project-summary></p><span class="code-symbol" aria-hidden="true">&lt;/&gt;</span></div></div>
    <div class="project-description"><div><h2 data-project-name></h2><p data-project-summary></p></div><span class="project-tag"></span></div>
    <p class="body-copy project-intro" data-project-description></p>
    <ul class="project-highlights"></ul>
    <div class="window-actions project-actions"><a class="primary-button" data-project-link target="_blank" rel="noopener noreferrer">查看项目 <span aria-hidden="true">↗</span></a><button class="secondary-button" data-open="contact">聊聊这个项目</button></div>
  </template>
  <template id="contact-template">
    <div class="contact-heading"><svg aria-hidden="true"><use href="#i-mail"/></svg><h2>保持联系</h2><p data-contact-intro></p></div>
    <div class="contact-list"></div>
    <p class="contact-footnote" data-contact-note></p>
  </template>
  <template id="project-card-template"><div class="project-item-art" aria-hidden="true"><span class="mini-terminal-dots">● ● ●</span><span class="mini-code">&lt;/&gt;</span><span class="mini-terminal-caption"></span></div><div class="project-item-info"><h3><span data-card-name></span> <span aria-hidden="true">↗</span></h3><p data-card-summary></p><span class="project-item-link">打开项目档案</span></div></template>
  <template id="contact-row-template"><svg class="contact-github" aria-hidden="true"><use href="#i-github"/></svg><div class="contact-details"><h3></h3><p></p></div><span class="contact-action" aria-hidden="true"></span></template>
  <div id="particle-layer" popover="manual" aria-hidden="true"></div>
  <noscript><p class="script-notice">请启用 JavaScript，以显示个人资料并打开桌面窗口。</p></noscript>
  <script src="site.config.js"></script>
  <script src="personalize.js"></script>
  <script src="app.js"></script>
</body>
</html>
